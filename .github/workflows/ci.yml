name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make deps
      - run: mise exec -- lua-language-server --check . --checklevel=Warning

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpq5 libsodium23 libuv1 libluajit-5.1-2
          sodium_lib="$(ldconfig -p | grep -m1 libsodium.so | awk '{print $NF}')"
          sudo ln -sf "$sodium_lib" "$(dirname "$sodium_lib")/libsodium.so"

      - run: make deps
      - run: make unit-test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d realworld -f sql/schema.sql

      - name: Build image (pure lunet, no nginx/OpenResty)
        run: docker build -t realworld-lunet-lua .

      - name: Start server against the Postgres service
        run: |
          docker run -d --name app --network host \
            -e PGHOST=localhost -e PGPORT=5432 -e PGDATABASE=realworld -e PGUSER=postgres -e PGPASSWORD=postgres \
            -e JWT_SECRET=ci-test-secret-not-for-production \
            realworld-lunet-lua
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8081/health && exit 0
            sleep 1
          done
          echo "server did not become healthy in time" >&2
          exit 1

      - uses: jdx/mise-action@v2

      - name: Run RealWorld Hurl compatibility suite
        run: HOST=http://localhost:8081 mise exec -- bash specs/run-api-tests-hurl.sh

      - name: Server logs
        if: always()
        run: docker logs app || true

  # Repack the lunet binary release + app into a self-extracting single-file
  # .run (scripts/bundle.sh) and verify it on each OS. No xmake anywhere:
  # the only build step is fetching the tagged lunet release.
  #
  # linux-arm64 is unblocked and verified via GitHub-hosted ubuntu-24.04-arm runners.
  # The embeddable SDK (#117) shipped in v0.5.0.
  #
  # Windows leg remains disabled: upstream lunet-windows-amd64.zip does not ship
  # the POSIX-only Rust extension modules (lunet.jsonic and lunet.lnt_shared)
  # because their underlying crates are POSIX-only. Because this application
  # requires both lunet.jsonic (JSON decode in router/HTTP) and lunet.lnt_shared
  # (request metrics on /health), running on Windows remains blocked upstream
  # until Windows builds or fallback implementations are provided.
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: realworld-conduit-linux-amd64.run
          - os: ubuntu-24.04-arm
            artifact: realworld-conduit-linux-arm64.run
          - os: macos-14
            artifact: realworld-conduit-darwin-arm64.run
          # - os: windows-2022
          #   artifact: realworld-conduit-windows-amd64.zip  # disabled: missing POSIX-only Rust ext modules (jsonic, lnt_shared)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpq5 libsodium23 libuv1 libluajit-5.1-2 postgresql postgresql-client
          sodium_lib="$(ldconfig -p | grep -m1 libsodium.so | awk '{print $NF}')"
          sudo ln -sf "$sodium_lib" "$(dirname "$sodium_lib")/libsodium.so"

      - name: Install runtime libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install lua luajit libuv libpq libsodium postgresql@16

      - name: Start PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb realworld
          PGPASSWORD=postgres psql -h localhost -U postgres -d realworld -f sql/schema.sql

      - name: Start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          initdb -D "$RUNNER_TEMP/pgdata" -U postgres >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -o "-p 5432" start
          createdb -h localhost -U postgres realworld
          psql -h localhost -U postgres -d realworld -f sql/schema.sql

      - name: Build the self-contained bundle
        run: ./scripts/bundle.sh

      - name: Start the bundled app
        run: |
          PGHOST=localhost PGPORT=5432 PGDATABASE=realworld PGUSER=postgres PGPASSWORD=postgres \
          JWT_SECRET=ci-test-secret-not-for-production \
            ./dist/${{ matrix.artifact }} > bundle.log 2>&1 &
          echo $! > bundle.pid
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8081/health && exit 0
            sleep 1
          done
          echo "bundled server did not become healthy in time" >&2
          cat bundle.log
          exit 1

      - name: Run RealWorld Hurl compatibility suite against the bundle
        run: HOST=http://localhost:8081 mise exec -- bash specs/run-api-tests-hurl.sh

      - name: Bundle logs
        if: always()
        run: cat bundle.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit-test, test, bundle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: realworld-conduit-*
          path: dist
          merge-multiple: true
      - name: Publish release with bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.run --title "$GITHUB_REF_NAME" --generate-notes
