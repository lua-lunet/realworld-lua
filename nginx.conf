# nginx front for the RealWorld frontend in this repository: gzip on,
# cache headers for the static assets, and /api/ reverse-proxied to the
# lunet backend. Never expose the lunet backend directly in production —
# put a front like this in front of it.
#
# Run from the repository root (paths below are prefix-relative):
#
#   nginx -p "$PWD" -c nginx.conf
#
# (the pid and nginx logs land in target/, which is gitignored)
#
# make frontend does not run this file directly: it writes an overridden
# copy to target/nginx.conf, replacing the listen and upstream-server ports
# (make frontend FRONTEND_PORT=8083 BACKEND_PORT=8081).
#
# This listens on :8083. The frontend itself is installed into frontend/ by
# scripts/frontend.sh or scripts/frontend-vanilla-pod.sh (make frontend).
#
# Edge settings are stated explicitly rather than left to nginx defaults.
# They follow the doctrine from lunet v0.18.1's ext/http/README.md and
# docs/SECURITY_ARCHITECTURE.md: state every default on purpose (defaults
# change across versions; stating them is version-proofing), align the
# parser caps with lunet's so the edge always answers first - lunet is
# never the strictest link in the chain and never the visible 431/413 for
# a request the edge accepted - and tighten the dribble timeouts so a
# client emitting single bytes to hold connections open is absorbed here,
# before lunet ever sees the drip. nginx is named only for illustration:
# OpenResty, Envoy, Caddy, Traefik, HAProxy and other products exist, and
# this is not a recommendation that nginx is the best edge proxy - always
# read the latest documentation of whichever edge you deploy.

pid target/nginx.pid;
error_log target/nginx-error.log;

events {
  # Fan-out budget. Pinned so upgrade defaults never shrink it silently.
  worker_connections 65536;
}

http {
  # Upstream pool for the lunet hop. This is the piece that makes upstream
  # keep-alive real: proxy_pass to a bare socket address does NOT pool
  # connections - only an upstream block with keepalive N does. Each worker
  # keeps up to N idle connections to lunet open and reuses them for
  # successive requests, matching the connection keep-alives lunet's HTTP/1.1
  # stack serves. Combined with proxy_http_version 1.1 and an empty
  # hop-by-hop Connection header (location /api/ below), consecutive
  # requests share one backend connection instead of one new TCP
  # connection per request.
  upstream lunet_backend {
    server 127.0.0.1:8081;
    keepalive 32;
  }

  access_log target/nginx-access.log;

  # Connection keep-alives on the client-facing side: the edge owns them
  # and serves many requests over one connection at the client's pace,
  # while lunet sees only the local hop. keepalive_requests is nginx's
  # default since 1.19.10 - stated to pin it.
  keepalive_timeout 65;
  keepalive_requests 1000;

  # Parser caps, aligned to lunet's ext/http/http_caps.lua defaults:
  # request line 8 KiB (one buffer), header section 32 KiB (4 x 8k),
  # body 1 MiB. The edge must always answer first (414 for an overlong
  # request line, 400/431 for oversized headers, 413 for an oversized
  # body), so lunet is never the strictest link. These are nginx's
  # defaults too - stated explicitly so they are pinned against future
  # nginx changes and so the alignment with lunet's caps is visible.
  large_client_header_buffers 4 8k;
  client_max_body_size 1m;

  # Drip protection: a client that sends single bytes to hold connections
  # open is cut off here (408) long before any lunet timeout - with the
  # request buffered in full before it reaches lunet (see
  # proxy_request_buffering below), lunet never sees the drip.
  client_header_timeout 10s;
  client_body_timeout 10s;

  # Malformed header names answer 400 rather than being silently dropped,
  # and //path is rejected rather than normalized: hostile framing dies at
  # the edge's own parser, per the lunet v0.18.1 security architecture.
  ignore_invalid_headers off;
  merge_slashes off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml;

  types {
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/png png;
    image/jpeg jpg jpeg;
    image/gif gif;
    image/svg+xml svg;
    text/plain txt;
    font/woff woff;
    font/woff2 woff2;
    font/ttf ttf;
    image/x-icon ico;
  }
  default_type text/html;

  server {
    listen 8083; # FRONTEND_PORT (make frontend overrides this via target/nginx.conf)
    server_name localhost;

    # Static frontend, installed by scripts/frontend.sh or
    # scripts/frontend-vanilla-pod.sh.
    root frontend;
    index index.html;

    # RealWorld-style fallbacks for extensionless deep links.
    location / {
      try_files $uri $uri.html $uri/ /index.html;
    }

    # Content-hash-free static assets: short shared cache, must-revalidate.
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Lunet stays off the network beyond this hop: it listens on TCP
    # loopback here (demo layout). A production Unix-socket deployment
    # (proxy_pass http://unix:/run/lunet/lunet.sock) is the stricter
    # transport, where filesystem permissions are the access control -
    # see lunet's SECURITY_ARCHITECTURE.md transport-options table.
    location /api/ {
      proxy_pass http://lunet_backend; # backend pool (make frontend overrides the upstream server via target/nginx.conf)
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Upstream keep-alive to lunet: HTTP/1.1 both ways, no hop-by-hop
      # Connection header forwarded. proxy_http_version 1.1 is nginx's
      # default only since 1.29.7 (1.0 before) - stated to be
      # version-proof, since the 1.0 default would send Connection: close
      # and kill keep-alive on the hop entirely.
      #
      # proxy_request_buffering on is also the nginx default - stated on
      # purpose: the entire request body is read from the client before
      # anything reaches lunet, so the edge absorbs slow-drip and
      # fragmented-framing attacks and lunet receives one well-formed
      # payload per request.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_request_buffering on;
    }
  }
}
