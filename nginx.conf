# nginx front for the RealWorld frontend in this repository: gzip on,
# cache headers for the static assets, and /api/ reverse-proxied to the
# lunet backend. Never expose the lunet backend directly in production —
# put a front like this in front of it.
#
# Run from the repository root (paths below are prefix-relative):
#
#   nginx -p "$PWD" -c nginx.conf
#
# (the pid and nginx logs land in target/, which is gitignored)
#
# This listens on :8083. The frontend itself is installed into frontend/ by
# scripts/frontend.sh or scripts/frontend-vanilla-pod.sh (make frontend).

pid target/nginx.pid;
error_log target/nginx-error.log;

events { }

http {
  access_log target/nginx-access.log;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml;

  types {
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/png png;
    image/jpeg jpg jpeg;
    image/gif gif;
    image/svg+xml svg;
    text/plain txt;
    font/woff woff;
    font/woff2 woff2;
    font/ttf ttf;
    image/x-icon ico;
  }
  default_type text/html;

  server {
    listen 8083;
    server_name localhost;

    # Static frontend, installed by scripts/frontend.sh or
    # scripts/frontend-vanilla-pod.sh.
    root frontend;
    index index.html;

    # RealWorld-style fallbacks for extensionless deep links.
    location / {
      try_files $uri $uri.html $uri/ /index.html;
    }

    # Content-hash-free static assets: short shared cache, must-revalidate.
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
      expires 1h;
      add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
