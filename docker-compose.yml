services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-realworld}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change-me}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  api-docs:
    image: swaggerapi/swagger-ui:v5.30.2
    profiles: ["docs"]
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yml
    volumes:
      - ./specs:/spec:ro

volumes:
  postgres_data:
